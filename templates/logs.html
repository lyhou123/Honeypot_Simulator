<!DOCTYPE html>
<html>
<head>
    <title>Honeypot Logs</title>
    <style>
        body { font-family: Arial; background: #f0f0f0; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { padding: 8px 12px; border: 1px solid #ccc; text-align: left; }
        th { background: #333; color: white; }
        tr:nth-child(even) { background: #eee; }
        h1 { text-align: center; }
    </style>
</head>
<body>
    <h1>Honeypot Access Logs</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>IP</th>
                <th>Path</th>
                <th>User-Agent</th>
                <th>Data</th>
                <th>Is bot</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td>{{ log[0] }}</td>
                <td>{{ log[1] }}</td>
                <td>{{ log[2] }}</td>
                <td>{{ log[3] }}</td>
                <td>{{ log[4] }}</td>
                <td>{{ log[6] }}</td>
                <td>{{ log[5] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
